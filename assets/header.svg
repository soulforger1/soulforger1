<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Zolboo Oktyabri, full-stack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#fbbf24"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="840 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <mask id="c1" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="330"><rect class="type t1" x="40" y="78" width="100" height="30" fill="#fff"/></mask>
    <mask id="c2" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="330"><rect class="type t2" x="40" y="112" width="350" height="46" fill="#fff"/></mask>
    <mask id="c3" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="330"><rect class="type t3" x="40" y="162" width="620" height="30" fill="#fff"/></mask>
    <mask id="c4" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="330"><rect class="type t4" x="40" y="206" width="170" height="30" fill="#fff"/></mask>
    <mask id="c5" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="330"><rect class="type t5" x="40" y="238" width="670" height="30" fill="#fff"/></mask>
  </defs>

  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .prompt { fill: #3fb950; font-size: 17px; }
    .cmd    { fill: #e6edf3; font-size: 17px; }
    .muted  { fill: #8b949e; font-size: 17px; }
    .name   { fill: url(#name); font-size: 36px; font-weight: 700; }
    .title  { fill: #8b949e; font-size: 13px; }
    .type { transform-box: fill-box; animation: type 1s both; }
    .t1 { animation-delay: .3s; animation-duration: .5s;  animation-timing-function: steps(8); }
    .t2 { animation-delay: 1s;  animation-duration: .9s;  animation-timing-function: steps(15); }
    .t3 { animation-delay: 2.1s; animation-duration: 1.6s; animation-timing-function: steps(59); }
    .t4 { animation-delay: 4s;  animation-duration: .7s;  animation-timing-function: steps(15); }
    .t5 { animation-delay: 4.9s; animation-duration: 1.6s; animation-timing-function: steps(63); }
    @keyframes type { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    .reveal { animation: show .01s 6.6s both; }
    @keyframes show { from { opacity: 0; } to { opacity: 1; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="898" height="328" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="328" rx="14" fill="url(#glow)"/>
  <path d="M1 15 a14 14 0 0 1 14 -14 h870 a14 14 0 0 1 14 14 v27 h-898 z" fill="#161b22"/>
  <line x1="1" y1="42" x2="899" y2="42" stroke="#30363d"/>
  <circle cx="26" cy="22" r="6.5" fill="#ff5f57"/>
  <circle cx="48" cy="22" r="6.5" fill="#febc2e"/>
  <circle cx="70" cy="22" r="6.5" fill="#28c840"/>
  <text x="450" y="26.5" text-anchor="middle" class="title">zolboo@soulforger1: ~</text>

  <!-- line 1 -->
  <g mask="url(#c1)">
    <text x="40" y="99"><tspan class="prompt">❯ </tspan><tspan class="cmd">whoami</tspan></text>
  </g>

  <!-- line 2 -->
  <g mask="url(#c2)">
    <text x="40" y="148" class="name">Zolboo Oktyabri</text>
  </g>

  <!-- line 3 -->
  <g mask="url(#c3)">
    <text x="40" y="183" class="muted">full-stack developer · web &amp; mobile · shipping since 2020</text>
  </g>

  <!-- line 4 -->
  <g mask="url(#c4)">
    <text x="40" y="227"><tspan class="prompt">❯ </tspan><tspan class="cmd">cat stack.txt</tspan></text>
  </g>

  <!-- line 5 -->
  <g mask="url(#c5)">
    <text x="40" y="259" font-size="17">
      <tspan fill="#3178c6">TypeScript</tspan><tspan fill="#484f58">  /  </tspan><tspan fill="#61dafb">React</tspan><tspan fill="#484f58">  /  </tspan><tspan fill="#e6edf3">Next.js</tspan><tspan fill="#484f58">  /  </tspan><tspan fill="#a5b4fc">Expo</tspan><tspan fill="#484f58">  /  </tspan><tspan fill="#e0234e">NestJS</tspan><tspan fill="#484f58">  /  </tspan><tspan fill="#ff7a1a">Hono</tspan><tspan fill="#484f58">  /  </tspan><tspan fill="#f38020">Cloudflare</tspan>
    </text>
  </g>

  <!-- prompt + blinking cursor -->
  <g class="reveal">
    <text x="40" y="299" class="prompt">❯</text>
    <rect x="60" y="284" width="10" height="19" fill="#e6edf3" class="cursor"/>
  </g>
</svg>
